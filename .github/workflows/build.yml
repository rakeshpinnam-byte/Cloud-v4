name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create build com.yourname.notepad NotepadApp
          cp index.html build/www/
          cp script.js build/www/
          cp style.css build/www/
          cp config.xml build/

      - name: Add Android Platform
        run: |
          cd build
          cordova platform add android

      - name: Build APK
        run: |
          cd build
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: NotepadApp-APK
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
